name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version aus dem Tag in manifest.json setzen
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' custom_components/saeulenwaechter/manifest.json > m.json
          mv m.json custom_components/saeulenwaechter/manifest.json
          sed -i "s/^VERSION = .*/VERSION = \"$VERSION\"/" custom_components/saeulenwaechter/const.py
      - name: ZIP bauen
        run: |
          cd custom_components/saeulenwaechter
          zip -r ../../saeulenwaechter.zip . -x '*__pycache__*' '*.pyc'
      - name: An das Release hängen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" saeulenwaechter.zip --clobber
