name: Validate

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r saeulenwaechter/requirements.txt pytest pytest-asyncio pytest-aiohttp
      - run: python -m pytest tests -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: "./saeulenwaechter"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image so bauen, wie es der Supervisor tut (amd64, mit seinem Standard-BUILD_FROM)
        run: docker build --platform linux/amd64 --build-arg BUILD_FROM=ghcr.io/home-assistant/base:latest -t saeulenwaechter:test saeulenwaechter
      - name: App startet und antwortet
        run: |
          mkdir -p /tmp/sw && echo '{"total": 100000, "notify": false, "use_depot": false}' > /tmp/sw/options.json
          docker run -d --name sw -p 8099:8099 -e SW_ALLOW_ALL=1 -v /tmp/sw:/data saeulenwaechter:test
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8099/api/health && break; sleep 2; done
          curl -fs http://127.0.0.1:8099/ | grep -q saeulenwaechter-panel
          docker logs sw
