configuration:
  total:
    name: Gesamtbetrag (€)
    description: Nur für das Papierdepot (Startkapital). Im echten Depot rechnet die App immer mit 40/30/30 vom tatsächlichen Depotwert.
  notify:
    name: WhatsApp-Meldungen senden
  monthly_report:
    name: Monatsbericht auch ohne Änderung
  switch_warning:
    name: Vorwarnung, wenn ein Signal zum Monatsende kippen würde
  rebalance_month:
    name: Monat für das jährliche Angleichen (1–12)
  use_depot:
    name: Echtes Trade-Republic-Depot verwenden
    description: Nach dem Login in der App-Oberfläche. Aus = Papierdepot.
  extra_welt:
    name: Weitere ISINs Welt
    description: Kommagetrennt; zählen wie SPDR MSCI ACWI IMI.
  extra_gold:
    name: Weitere ISINs Gold
    description: Kommagetrennt; zählen wie Xetra-Gold.
  extra_anleihen:
    name: Weitere ISINs Anleihen
    description: Kommagetrennt; zählen wie Xtrackers Eurozone Gov Bond.
  bls_key:
    name: BLS-API-Key (optional)
    description: Für mehr Abrufe der US-Arbeitslosenquote.
  cash_zins:
    name: Zinssatz auf Cash in % (optional)
    description: Leer lassen, dann gilt der Zinssatz, den Trade Republic beim Abgleich meldet. Ein eigener Wert (z. B. 2,0) hat Vorrang.
  cash_reserve:
    name: Cash-Reserve außerhalb der Strategie (€)
    description: Dieser Teil des Guthabens bei Trade Republic zählt nicht zur Strategie (z. B. Notgroschen). 0 = alles Cash gehört zur Strategie.
  ha_service:
    name: Benachrichtigungsdienst in Home Assistant
    description: "z. B. whatsapp.send_message (WhatsApp for Home Assistant, Standard), notify.mobile_app_<handy> (Home-Assistant-App) oder telegram_bot.send_message."
  ha_target:
    name: Empfänger
    description: "Bei WhatsApp die Nummer (z. B. +49171… oder 0171…) oder eine Gruppen-ID (…@g.us); bei notify.mobile_app leer lassen."
