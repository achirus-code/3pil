configuration:
  total:
    name: Total amount (€)
    description: Paper mode only (starting capital). With the real depot the app always uses 40/30/30 of the actual depot value.
  notify:
    name: Send WhatsApp messages
  monthly_report:
    name: Monthly report even without changes
  switch_warning:
    name: Warn when a signal would flip at the month end
  rebalance_month:
    name: Month for the yearly rebalancing (1–12)
  use_depot:
    name: Use the real Trade Republic depot
    description: After logging in on the app page. Off = paper depot.
  extra_welt:
    name: Additional ISINs World
    description: Comma separated; count as SPDR MSCI ACWI IMI.
  extra_gold:
    name: Additional ISINs Gold
    description: Comma separated; count as Xetra-Gold.
  extra_anleihen:
    name: Additional ISINs Bonds
    description: Comma separated; count as Xtrackers Eurozone Gov Bond.
  bls_key:
    name: BLS API key (optional)
    description: For more requests of the US unemployment rate.
  cash_zins:
    name: Interest rate on cash in % (optional)
    description: Leave empty to use the rate Trade Republic reports on each sync. Your own value (e.g. 2.0) takes precedence.
  cash_reserve:
    name: Cash reserve outside the strategy (€)
    description: This part of your Trade Republic cash does not count towards the strategy (e.g. emergency fund). 0 = all cash belongs to the strategy.
  ha_service:
    name: Notification service in Home Assistant
    description: "e.g. whatsapp.send_message (WhatsApp for Home Assistant, default), notify.mobile_app_<phone> (Home Assistant app) or telegram_bot.send_message."
  ha_target:
    name: Recipient
    description: "For WhatsApp the number (e.g. +49171… or 0171…) or a group ID (…@g.us); empty for notify.mobile_app."
